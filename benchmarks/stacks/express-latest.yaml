id: express-latest
language: javascript
language_version: "26.13.1"
framework: express
framework_version: "5.3.0"
description: Node.js 26.13.1 and Express 5.3.0, backed by PostgreSQL 18.7.
framework_version_param: true
# A thin build on node:26.13.1-bookworm-slim that declares ARG FRAMEWORK_VERSION.
dockerfile: express-latest/Dockerfile
build_context: express-latest/
workdir: /workspace
environment_notes: |
  - Express is installed in the starter package.json before you begin.
  - PostgreSQL 18.7 is running at host "postgres", port 5432. Its connection URL is in
    the DATABASE_URL environment variable (postgresql://user:password@host:port/db).
setup_commands:
  - [sh, -lc, "npm init -y >/dev/null && npm install --no-audit --no-fund --save-exact \"express@$FRAMEWORK_VERSION\""]
version_probes:
  language: [sh, -lc, "node -p process.versions.node"]
  framework: [sh, -lc, "node -p \"require('express/package.json').version\""]
env:
  DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
services:
  - name: postgres
    image: postgres:18.7-alpine
    env:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports: [5432]
    healthcheck: [pg_isready, -U, bench]
resources:
  cpus: 2
  memory: 4g
