id: spring-boot
language: java
language_version: "21"
framework: spring-boot
framework_version: "3.4.5"
description: Spring Boot with Maven and PostgreSQL.
image: maven:3.9.9-eclipse-temurin-21
environment_notes: |
  - A Maven project descriptor pins Spring Boot 3.4.5 with spring-boot-starter-web. Maven and Java 21 are available.
  - PostgreSQL 16 runs at postgres:5432. DATABASE_URL is a PostgreSQL URL, not a JDBC URL.
setup_commands:
  - - sh
    - -lc
    - |
      cat > pom.xml <<'XML'
      <project xmlns="http://maven.apache.org/POM/4.0.0">
        <modelVersion>4.0.0</modelVersion>
        <parent>
          <groupId>org.springframework.boot</groupId>
          <artifactId>spring-boot-starter-parent</artifactId>
          <version>3.4.5</version>
          <relativePath/>
        </parent>
        <groupId>bench</groupId><artifactId>app</artifactId><version>1.0.0</version>
        <properties><java.version>21</java.version></properties>
        <dependencies>
          <dependency>
            <groupId>org.springframework.boot</groupId>
            <artifactId>spring-boot-starter-web</artifactId>
          </dependency>
        </dependencies>
      </project>
      XML
env:
  DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
version_probes:
  language:
    - sh
    - -lc
    - >-
      "$JAVA_HOME/bin/java" -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java\.version = //p'
  # The parent POM version alone proves nothing: read the resolved Boot artifact
  # from the app's dependencies, and only after Maven succeeds.
  framework:
    - sh
    - -ec
    - |
      mvn -B -q -Dstyle.color=never dependency:list \
        -DincludeArtifactIds=spring-boot \
        -DoutputFile=/tmp/spring-boot-deps.txt
      sed -n 's/.*org\.springframework\.boot:spring-boot:jar:\([^:]*\):.*/\1/p' /tmp/spring-boot-deps.txt
services:
  - name: postgres
    image: postgres:16.4-alpine
    env: {POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench}
    ports: [5432]
    healthcheck: [pg_isready, -U, bench]
resources: {cpus: 2, memory: 4g}
