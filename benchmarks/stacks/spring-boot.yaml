id: spring-boot
language: java
language_version: "21"
framework: spring-boot
framework_version: "3.4.5"
description: Spring Boot with Maven and PostgreSQL.
image: maven:3.9.9-eclipse-temurin-21
environment_notes: |
  - A Maven project descriptor pins Spring Boot 3.4.5. Maven and Java 21 are available.
  - PostgreSQL 16 runs at postgres:5432. DATABASE_URL is a PostgreSQL URL, not a JDBC URL.
setup_commands:
  - - sh
    - -lc
    - |
      cat > pom.xml <<'XML'
      <project xmlns="http://maven.apache.org/POM/4.0.0">
        <modelVersion>4.0.0</modelVersion>
        <parent>
          <groupId>org.springframework.boot</groupId>
          <artifactId>spring-boot-starter-parent</artifactId>
          <version>3.4.5</version>
          <relativePath/>
        </parent>
        <groupId>bench</groupId><artifactId>app</artifactId><version>1.0.0</version>
        <properties><java.version>21</java.version></properties>
      </project>
      XML
env:
  DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
version_probes:
  language:
    - sh
    - -lc
    - >-
      "$JAVA_HOME/bin/java" -XshowSettings:properties -version 2>&1 | sed -n 's/^ *java\.version = //p'
  framework: [sh, -lc, "mvn -B -q -Dstyle.color=never help:evaluate -Dexpression=project.parent.version -DforceStdout | sed 's/\x1b\\[[0-9;]*m//g'"]
services:
  - name: postgres
    image: postgres:16.4-alpine
    env: {POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench}
    ports: [5432]
    healthcheck: [pg_isready, -U, bench]
resources: {cpus: 2, memory: 4g}
