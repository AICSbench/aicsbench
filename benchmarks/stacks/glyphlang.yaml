id: glyphlang
language: glyphlang
language_version: "0.8.0"
framework: glyphlang
framework_version: "0.8.0"
description: Experimental native GlyphLang runtime patched to use PostgreSQL.
dockerfile: glyphlang/Dockerfile
environment_notes: |
  - Write native .glyph source. The language reference is at /opt/glyphlang/llms.txt.
  - The runtime uses DATABASE_URL for interpreted HTTP routes with database injection.
  - Use psql with DATABASE_URL to apply SQL migrations.
version_probes:
  language: [sh, -lc, "glyph version | sed 's/^GlyphLang v//'"]
  framework: [sh, -lc, "glyph version | sed 's/^GlyphLang v//'"]
env:
  DATABASE_URL: postgresql://bench:bench@postgres:5432/bench?sslmode=disable
services:
  - name: postgres
    image: postgres:16.4-alpine
    env:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports: [5432]
    healthcheck: [pg_isready, -U, bench]
resources: {cpus: 2, memory: 4g}
