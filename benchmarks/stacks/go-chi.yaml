id: go-chi
language: go
language_version: "1.24.3"
framework: chi
framework_version: "5.2.1"
description: Go with the chi HTTP router and PostgreSQL.
image: golang:1.24.3-bookworm
environment_notes: |
  - A Go module with chi v5.2.1 is initialized. Keep that router version.
  - PostgreSQL 16 runs at postgres:5432. Use DATABASE_URL for the connection.
setup_commands:
  - [sh, -c, "go mod init benchmark.local/app && go get github.com/go-chi/chi/v5@v5.2.1"]
env:
  GOPATH: /home/agent/go
  DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
version_probes:
  language: [sh, -ec, "version=$(go env GOVERSION); echo \"${version#go}\""]
  framework: [sh, -ec, "version=$(go list -m -f '{{.Version}}' github.com/go-chi/chi/v5); echo \"${version#v}\""]
services:
  - name: postgres
    image: postgres:16.4-alpine
    env: {POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench}
    ports: [5432]
    healthcheck: [pg_isready, -U, bench]
resources: {cpus: 2, memory: 4g}
