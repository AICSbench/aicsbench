id: rails
language: ruby
language_version: "3.4.3"
framework: rails
framework_version: "8.0.2"
description: Ruby and Rails backed by PostgreSQL.
dockerfile: rails/Dockerfile
environment_notes: |
  - Rails 8.0.2 is available via the rails command. Create an API-only project.
  - PostgreSQL 16 runs at postgres:5432. Use DATABASE_URL for the connection.
  - The acceptance runner connects on the trial network using HTTP hostname `app`. Add `config.hosts << "app"` to the Rails environment used by `start.sh` if host authorization is enabled. Keep host authorization enabled if it is already active.
env:
  BUNDLE_PATH: /home/agent/.bundle/gems
  DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
version_probes:
  language: [sh, -lc, "ruby -e 'puts RUBY_VERSION'"]
  framework: [sh, -lc, "bundle exec ruby -e 'require \"rails\"; puts Rails.version'"]
services:
  - name: postgres
    image: postgres:16.4-alpine
    env: {POSTGRES_USER: bench, POSTGRES_PASSWORD: bench, POSTGRES_DB: bench}
    ports: [5432]
    healthcheck: [pg_isready, -U, bench]
resources: {cpus: 2, memory: 4g}
