[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aicsbench"
version = "0.1.0"
description = "Open-source platform for benchmarking AI coding agents across languages and frameworks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "packaging>=22",
  "typer>=0.12",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
  # Test only: the site export test validates the fixture against its JSON Schemas.
  "jsonschema>=4.18",
]

[project.scripts]
aicsbench = "aicsbench.cli.app:main"

# Third-party agent adapters register themselves here, so the core never
# needs to change when a new agent is added:
#
# [project.entry-points."ai_benchmark.agents"]
# my-agent = "my_package.adapter:MyAgentAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/aicsbench", "src/ai_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer resolves annotations at runtime; keep Optional[...] for clarity there.
"src/aicsbench/cli/*" = ["UP007", "UP045"]

[tool.ruff.format]
# Published acceptance suites are byte-hashed; even formatting changes their identity.
exclude = ["benchmarks/tasks/*/acceptance/**"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
