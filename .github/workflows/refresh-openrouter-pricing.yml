name: Refresh OpenRouter pricing

on:
  schedule:
    - cron: '0 2 * * 1' # Monday, 09:00 WIB
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openrouter-pricing-refresh

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Refresh and compare catalog
        id: catalog
        env:
          PYTHONPATH: src
        run: |
          candidate="$RUNNER_TEMP/openrouter-models.json"
          python scripts/refresh_openrouter_models.py --output "$candidate"
          python - "$candidate" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from aicsbench.pricing import SNAPSHOT_PREFIX, load_catalog, snapshot_filename

          candidate = Path(sys.argv[1])
          current = max(Path('src/aicsbench/pricing').glob(f'{SNAPSHOT_PREFIX}*.json'))
          catalog = load_catalog(candidate)

          def entries(path):
              return {entry['id']: entry for entry in json.loads(path.read_text())['models']}

          before, after = entries(current), entries(candidate)
          if before == after:
              print('Catalog content is unchanged; checking for a stale refresh PR.')
              sys.exit(0)
          if catalog.retrieved_at <= load_catalog(current).retrieved_at:
              raise ValueError('Changed catalog must be newer than the current snapshot')

          added = len(after.keys() - before.keys())
          removed = len(before.keys() - after.keys())
          updated = sum(before[key] != after[key] for key in before.keys() & after.keys())
          summary = f'{added} added, {removed} removed, {updated} updated.'
          print(summary)
          with current.with_name(snapshot_filename(catalog.retrieved_at)).open('xb') as snapshot:
              snapshot.write(candidate.read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'summary={summary}', file=output)
          PY
      - name: Check PR credentials
        env:
          PRICING_REFRESH_TOKEN: ${{ secrets.PRICING_REFRESH_TOKEN }}
        run: |
          if [ -z "$PRICING_REFRESH_TOKEN" ]; then
            echo '::error::Set the PRICING_REFRESH_TOKEN repository Actions secret to manage the refresh PR.'
            exit 1
          fi
      - name: Reconcile the catalog PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.PRICING_REFRESH_TOKEN }}
          branch: automation/openrouter-pricing
          delete-branch: true
          add-paths: src/aicsbench/pricing/openrouter-models-*.json
          commit-message: 'chore: refresh OpenRouter pricing snapshot'
          title: 'chore: refresh OpenRouter pricing snapshot'
          body: |
            Refresh the bundled catalog from the public OpenRouter Models API.

            Models: ${{ steps.catalog.outputs.summary }}

            Review the catalog diff before merging. CLI reports remain offline.
