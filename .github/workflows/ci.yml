name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -e '.[dev]'
      # The pinned OpenCode CLI keeps the custom-endpoint loader regression
      # (tests/test_custom_endpoints.py::..._in_the_real_loader) from skipping.
      - run: npm install -g --no-audit --no-fund opencode-ai@1.19.5
      - run: ruff check src tests benchmarks scripts
      - run: ruff format --check src tests benchmarks scripts
      - run: mypy src scripts
      - run: pytest
      # The loader regression must run, not skip: the log line names it with
      # PASSED, since the pytest summary alone does not identify skips.
      - name: Confirm the OpenCode loader regression ran against the pinned CLI
        run: pytest -o addopts='' -v tests/test_custom_endpoints.py::test_opencode_inline_config_beats_workspace_config_in_the_real_loader
      - name: Check installed CLI and benchmark definitions
        run: |
          aicsbench --help
          aicsbench validate

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: docker info
      - run: pytest tests/integration
        env:
          BENCHMARK_DOCKER_TESTS: "1"
